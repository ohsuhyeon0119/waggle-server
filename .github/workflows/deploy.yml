name: Deploy

on:
  push:
    branches: [main]
  # Allow manual runs without a push, e.g. after changing only a secret.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Run one deployment at a time so that runs do not overlap.
concurrency: deploy

jobs:
  deploy:
    # arm64 runner, the same architecture as the cluster nodes. Free for public repositories.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        # GHCR image names must be lowercase. The tag is the first 7 characters of the commit SHA.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-kubectl@v4

      - name: Set up kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply secret
        # Create the Kubernetes Secret from the Actions secrets, or update it if it already exists.
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          if [ -z "$JWT_SECRET" ] || [ -z "$DB_PASSWORD" ]; then echo "JWT_SECRET or DB_PASSWORD is not set"; exit 1; fi
          kubectl create secret generic waggle-api \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|" k8s/waggle-api.yaml | kubectl apply -f -
          kubectl rollout status deployment/waggle-api --timeout=180s
