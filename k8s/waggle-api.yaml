apiVersion: apps/v1
kind: Deployment
metadata:
  name: waggle-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: waggle-api
  template:
    metadata:
      labels:
        app: waggle-api
    spec:
      containers:
        - name: waggle-server
          # The workflow replaces IMAGE_PLACEHOLDER with the image it just built before applying.
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/spring_seminar?characterEncoding=UTF-8
            - name: SPRING_DATASOURCE_USERNAME
              value: spring
            - name: WAGGLE_CORS_ALLOWED_ORIGINS
              value: https://waggle.wafflestudio.com
          # Secret values come from the Secret created by the workflow.
          # Each key in the Secret (SPRING_DATASOURCE_PASSWORD, JWT_SECRET) becomes an environment variable.
          envFrom:
            - secretRef:
                name: waggle-api
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v3/api-docs
              port: 8080
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: waggle-api
spec:
  type: ClusterIP
  selector:
    app: waggle-api
  ports:
    - port: 80
      targetPort: 8080
